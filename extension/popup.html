
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebWise AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h2>WebWise AI</h2>
    <p>Ask questions about the webpage you're viewing.</p>

    <button id="summarize">Summarize Page</button>

    <textarea
      id="question"
      placeholder="Ask something about this webpage..."
    ></textarea>

    <button id="ask">Ask AI</button>

    <p id="status"></p>
    <div id="answer">Your answer will appear here.</div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
